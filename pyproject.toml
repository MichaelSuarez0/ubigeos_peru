[project]
name = "ubigeos-peru"
version = "0.2.3"
description = "Librería de Python que convierte códigos de ubigeo en su correspondiente departamento, provincia o distrito, y viceversa, además de información suplementaria."
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [{ name = "Michael Suárez", email = "a20180264@pucp.edu.pe" }]
keywords = [
  "ubigeo",
  "peru",
  "departamentos",
  "provincias",
  "distritos",
  "enaho",
]
license = "MIT"
dependencies = ["narwhals>=2.21.0", "orjson", "rapidfuzz"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",

  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: Spanish",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubigeos_peru"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"

[tool.ruff.lint]
select = ["F", "I", "E"]
ignore = ["E501"]

[dependency-groups]
dev = [
  "fastexcel>=0.12.1",
  "natsort>=8.4.0",
  "polars>=1.8.2",
  "pyarrow>=17.0.0",
  "pytest>=8.3.5",
  "xlrd>=2.0.2",
  "beautifulsoup4>=4.14.2",
  "mkdocs-material>=9.6.23",
  "ruff>=0.16.1",
]

[project.urls]
Homepage = "https://github.com/MichaelSuarez0/ubigeos_peru"
Repository = "https://github.com/MichaelSuarez0/ubigeos_peru"
Documentation = "https://michaelsuarez0.github.io/ubigeos_peru/"
Changelog = "https://github.com/MichaelSuarez0/ubigeos_peru/blob/main/CHANGELOG.md"
Issues = "https://github.com/MichaelSuarez0/ubigeos_peru/issues"
