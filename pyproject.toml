[project]
name = "ubigeos-peru"
version = "0.2.3"
description = "Librería de Python que convierte códigos de ubigeo en su correspondiente departamento, provincia o distrito, y viceversa, además de información suplementaria."
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [{ name = "Michael Suárez", email = "a20180264@pucp.edu.pe" }]
keywords = [
  "ubigeo",
  "peru",
  "departamentos",
  "provincias",
  "distritos",
  "enaho",
]
license = "MIT"
dependencies = ["narwhals>=2.21.0", "orjson", "rapidfuzz"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",

  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: Spanish",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubigeos_peru"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"

[tool.ruff.lint]
select = ["F", "I", "E"]
ignore = ["E501"]

[dependency-groups]
dev = [
  "black>=24.8.0",
  "fastexcel>=0.12.1",
  "natsort>=8.4.0",
  "numpy>=1.26",
  "openpyxl>=3.1.5",
  "pandas>=2.3.2",
  "polars>=1.8.2",
  "pyarrow>=17.0.0",
  "pytest>=8.3.5",
  "xlrd>=2.0.2",
  "duckdb>=1.4.1",
  "beautifulsoup4>=4.14.2",
  "mkdocs-material>=9.6.23",
  "git-cliff>=2.13.1",
  "pre-commit>=4.3.0",
  "ruff>=0.16.1",
]

[tool.bumpversion]
current_version = "0.2.3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "chore(release): bump version {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/ubigeos_peru/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[project.urls]
Homepage = "https://github.com/MichaelSuarez0/ubigeos_peru"
Repository = "https://github.com/MichaelSuarez0/ubigeos_peru"
Documentation = "https://michaelsuarez0.github.io/ubigeos_peru/"
Changelog = "https://github.com/MichaelSuarez0/ubigeos_peru/blob/main/CHANGELOG.md"
Issues = "https://github.com/MichaelSuarez0/ubigeos_peru/issues"
